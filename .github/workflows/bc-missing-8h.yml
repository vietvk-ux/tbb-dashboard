name: BC Mất tích (sáng 08:00)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  missing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Gửi BC Mất tích
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GTALK_OA_TOKEN: ${{ secrets.GTALK_OA_TOKEN }}
          GTALK_CHANNEL_ID: ${{ secrets.GTALK_CHANNEL_ID }}
          GTALK_CHANNEL_ID_2: ${{ secrets.GTALK_CHANNEL_ID_2 }}
        run: python report_bc_missing.py
