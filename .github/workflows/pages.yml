name: Báo cáo %GTC cuối ngày TBB (23h)

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Ngày YYYY-MM-DD (trống = hôm nay)'
        required: false
        default: ''
      send:
        description: 'Gửi GTalk? 1=có, 0=không (test)'
        required: false
        default: '1'
  schedule:
    # 23:00 VN = 16:00 UTC — tự cập nhật cuối ngày (repo public nên dùng được schedule GitHub)
    - cron: '0 16 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Trang realtime (index.html)
        env:
          NHANH_TOKEN: ${{ secrets.NHANH_TOKEN }}
          DASH_SLUG: 9c7e4b21a6f0
        run: python report_live.py
      - name: Báo cáo %GTC cuối ngày (eod.html) + gửi GTalk
        env:
          NHANH_TOKEN: ${{ secrets.NHANH_TOKEN }}
          EOD_DATE: ${{ github.event.inputs.date }}
          DASH_SLUG: 9c7e4b21a6f0
          DASH_URL: https://vietvk-ux.github.io/tbb-dashboard/9c7e4b21a6f0/eod.html
          DASH_SEND: ${{ github.event.inputs.send || '1' }}
          GTALK_OA_TOKEN: ${{ secrets.GTALK_OA_TOKEN }}
          GTALK_CHANNEL_ID: ${{ secrets.GTALK_CHANNEL_ID }}
        run: python report_dashboard.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
