name: Kho chuyển tiếp (8h · 16h · 22h)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kho:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Gửi Kho chuyển tiếp
        env:
          NHANH_TOKEN: ${{ secrets.NHANH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GTALK_OA_TOKEN: ${{ secrets.GTALK_OA_TOKEN }}
          GTALK_CHANNEL_KHO: ${{ secrets.GTALK_CHANNEL_KHO }}
        run: python report_khochuyentiep.py
