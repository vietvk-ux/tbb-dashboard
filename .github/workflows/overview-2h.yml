name: Tổng quan TBB (2 tiếng/lần 9h-21h)

on:
  # CHỈ dùng cron-job.org kích (cron '0 9-21/2 * * *' giờ VN) — ĐÚNG GIỜ, không trễ.
  # ĐÃ BỎ GitHub schedule: nó hay trễ 1-3h → dồn lượt 21h sang ~23h = gửi tin trùng/muộn.
  # (Khác live-30m: bên đó chỉ deploy trang nên trễ vô hại; báo cáo này GỬI tin nên phải đúng giờ.)
  workflow_dispatch:
    inputs:
      dry:
        description: 'Chạy thử (không gửi)? 1=thử, để trống=gửi thật'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Gửi báo cáo tổng quan
        env:
          NHANH_TOKEN: ${{ secrets.NHANH_TOKEN }}
          GTALK_OA_TOKEN: ${{ secrets.GTALK_OA_TOKEN }}
          GTALK_CHANNEL_ID: ${{ secrets.GTALK_CHANNEL_ID }}
          GTALK_CHANNEL_ID_2: ${{ secrets.GTALK_CHANNEL_ID_2 }}
          OVERVIEW_DRY: ${{ github.event.inputs.dry }}
        run: python report_overview.py
