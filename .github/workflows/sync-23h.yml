name: Đồng bộ DB cuối ngày (23h35)

# LUỒNG RIÊNG chỉ ghi Supabase — KHÔNG có environment github-pages nên KHÔNG
# bao giờ kẹt "waiting" như live-30m. Đảm bảo dữ liệu ngày luôn được lưu dù trang
# web có kẹt deploy. Chạy độc lập, không đụng GitHub Pages.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Ngày YYYY-MM-DD (trống = tự tính ngày vừa kết thúc)'
        required: false
        default: ''
  schedule:
    # 23:35 VN = 16:35 UTC — sau slot EOD 23:30, độc lập. Trễ vài phút không sao
    # vì logic ngày tự lấy ngày vừa kết thúc; chuyến đã đóng là số cố định.
    - cron: '35 16 * * *'

permissions:
  contents: write   # commit khuvuc_data/ (bản đồ khu vực 30 ngày)

concurrency:
  group: db-sync-23h
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Sync dữ liệu ngày vào Supabase
        env:
          NHANH_TOKEN: ${{ secrets.NHANH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EOD_DATE: ${{ github.event.inputs.date }}
        run: python report_db_sync.py
      - name: Commit dữ liệu bản đồ khu vực (khuvuc_data/)
        run: |
          if [ -n "$(git status --porcelain khuvuc_data/)" ]; then
            git config user.name "tbb-bot"
            git config user.email "tbb-bot@users.noreply.github.com"
            git pull --rebase --autostash origin main || true
            git add khuvuc_data/
            git commit -m "khuvuc_data: chốt bản đồ khu vực $(TZ=Asia/Ho_Chi_Minh date +%F)" || true
            git push origin HEAD:main || true
          else
            echo "khuvuc_data không đổi — bỏ qua commit"
          fi
