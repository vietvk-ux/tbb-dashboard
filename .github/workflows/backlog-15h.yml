name: Chụp tồn chưa gán giao 15h

on:
  workflow_dispatch:
  schedule:
    # 15:00 VN = 08:00 UTC (có thể trễ vài phút — vẫn là số giữa chiều)
    - cron: '0 8 * * *'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Chụp backlog 15h
        env:
          NHANH_TOKEN: ${{ secrets.NHANH_TOKEN }}
        run: python capture_backlog.py
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backlog_15h.json
          git commit -m "backlog 15h $(date -u +%F)" || echo "no change"
          git push
